<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Policy AI Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Policy AI Frontend</h1>
    <form id="dataForm">
        <input type="text" id="docField" placeholder="Document URL" required>
        <input type="text" id="questionField" placeholder="Enter your question" required>
        <button type="submit">Ask</button>
    </form>
    <div id="result"></div>

    <script>
    document.getElementById('dataForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const docUrl = document.getElementById('docField').value;
        const question = document.getElementById('questionField').value;

        const payload = {
            documents: docUrl,
            questions: [question]
        };

        const res = await fetch('https://policyai-production.up.railway.app/hackrx/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        const json = await res.json();
        document.getElementById('result').textContent = JSON.stringify(json, null, 2);
    });
    </script>
</body>
</html>
